<div class="auth-card">
    <h1 class="fs-3 mb-3">Authenticator code</h1>
    <p>Enter the 6-digit code your authenticator app shows for Invest.</p>
    {{error}}
    <form method="post" action="/login/code">
        <input type="hidden" name="_csrf" value="{{csrf}}">
        <div class="mb-4">
            <label for="code" class="form-label">Code</label>
            <input id="code" name="code" class="form-control code-input" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
    <form method="post" action="/logout" class="mt-3 text-center">
        <input type="hidden" name="_csrf" value="{{csrf}}">
        <button type="submit" class="btn btn-link">Start over</button>
    </form>
</div>
